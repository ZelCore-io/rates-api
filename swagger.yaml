openapi: 3.0.0
info:
  title: Rates API
  description: API documentation for the Rates API.
  version: 3.0.0

paths:
  /:
    get:
      summary: Redirect to /rates
      description: Redirects the root path to the /rates endpoint.
      responses:
        '302':
          description: Redirection to /rates.

  /rates:
    get:
      summary: Get exchange rates
      description: Retrieves exchange rates.
      responses:
        '200':
          description: A list of exchange rates.
          content:
            application/json:
              schema:
                type: object

  /marketsusd:
    get:
      summary: Get market data in USD
      description: Retrieves market data in USD.
      responses:
        '200':
          description: A list of market data in USD.
          content:
            application/json:
              schema:
                type: object

  /v2/rates:
    get:
      summary: Get exchange rates (v2)
      description: >
        Retrieves version 2 of the exchange rates. The `crypto` array includes
        one synthetic entry per Binance bStock (tokenized US equity on BNB
        Smart Chain), alongside the regular CoinGecko/CryptoCompare/LiveCoinWatch
        entries.


        bStock entries are identified by `id` starting with `bstock-` (e.g.
        `bstock-tslab` for the Tesla bStock). They are always tagged
        `provider: "coingecko"` — never `"binance"` — because the ZelCore
        client matches market entries on the literal string
        `${provider}-${id}`, and the sibling `api` repo advertises each
        bStock's `coinInfo.coingeckoID` as `bstock-<code>`. Using any other
        provider value would make the client-side lookup miss silently.


        `rates.usd` and `rates.btc` are sourced from live Binance Spot
        `<CODE>USDT` tickers (bStocks are quoted in USDT, not USDC) divided by
        the same batch's `BTCUSDT` price; `change24h`/`change7d` come from
        Binance's 24h and 7d rolling-window tickers. During a CEX trading
        halt (e.g. around a stock split) the last known-good price is served
        rather than dropping the entry, per the bStocks partner guide's
        display-only allowance.
      responses:
        '200':
          description: A list of exchange rates (v2).
          content:
            application/json:
              schema:
                type: object
                properties:
                  crypto:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: bstock-tslab
                        provider:
                          type: string
                          example: coingecko
                        rates:
                          type: object
                          properties:
                            usd:
                              type: number
                            btc:
                              type: number
                        change24h:
                          type: number
                        change7d:
                          type: number
                  fiat:
                    type: array
                    items:
                      type: object
                  errors:
                    type: object

  /v2/rates-compressed:
    get:
      summary: Get compressed exchange rates (v2)
      description: Retrieves a compressed version of the exchange rates (v2).
      responses:
        '200':
          description: Compressed exchange rates (v2).
          content:
            application/json:
              schema:
                type: object

  /v2/prices/history/{geckoId}:
    get:
      summary: Get fiat price history for one coin
      description: >
        Price history for one CoinGecko id in one fiat currency between two
        unix timestamps, for wallet tax exports. Points in the last 90 UTC
        days are hourly; older points are daily (one per UTC day, 00:00). A
        range crossing that line returns granularity "mixed" with one daily
        and one hourly entry in `segments`. Only ids ZelCore carries are
        served. `from` before 2013-04-28 is clamped to it and `to` after now
        is clamped to now. Cached per coin, currency and UTC day (closed days
        30 days once ended 2+ hours ago, otherwise and for empty days 1 hour);
        responses are not cached at the route level. Upstream use is budgeted; when the
        budget is spent or CoinGecko rate-limits, the endpoint answers 503
        with Retry-After.
      parameters:
        - name: geckoId
          in: path
          required: true
          description: CoinGecko coin id.
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,100}$'
            example: bitcoin
        - name: vs
          in: query
          required: true
          description: Fiat currency code (case-insensitive), e.g. usd, eur, gbp.
          schema:
            type: string
            example: eur
        - name: from
          in: query
          required: true
          description: Range start, unix seconds (inclusive).
          schema:
            type: integer
            example: 1514764800
        - name: to
          in: query
          required: true
          description: Range end, unix seconds (inclusive). Must be after `from`, at most 10 years later.
          schema:
            type: integer
            example: 1546300799
      responses:
        '200':
          description: Price points as [epochMs, price] pairs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: number
                  granularity:
                    type: string
                    enum: [daily, hourly, mixed]
                  segments:
                    type: array
                    description: Contiguous parts of the range by granularity; from/to are epoch ms, inclusive.
                    items:
                      type: object
                      properties:
                        granularity:
                          type: string
                          enum: [daily, hourly]
                        from:
                          type: integer
                        to:
                          type: integer
        '400':
          description: Invalid geckoId, unsupported vs currency, from >= to, from in the future, or a span over 10 years.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryError'
        '404':
          description: ZelCore does not carry this id, or CoinGecko does not know it (cached for 10 minutes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryError'
        '502':
          description: Upstream failure (outage, timeout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryError'
        '503':
          description: Upstream budget spent, too many concurrent upstream calls, or CoinGecko rate limit cooldown.
          headers:
            Retry-After:
              description: Seconds until a retry can be admitted.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceHistoryError'

  /v2/blockbook/api/v3/simple/supported_vs_currencies:
    get:
      summary: Quote currencies (CoinGecko shape)
      description: >
        CoinGecko v3 `simple/supported_vs_currencies` for Blockbook's fiat
        downloader. Cached 24 hours. When CoinGecko can't be asked, the last
        good list is served, or before the first answer a static list (the
        price-history fiats plus btc, eth and vef). Always 200.
      responses:
        '200':
          description: Lowercase currency codes.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [btc, eth, usd, eur]

  /v2/blockbook/api/v3/simple/price:
    get:
      summary: Current prices (CoinGecko shape)
      description: >
        CoinGecko v3 `simple/price` for Blockbook's fiat downloader. Only the
        configured explorer coins (bitcoin, groestlcoin, litecoin, zcash, digibyte, dogecoin, dash, vertcoin, ravencoin, ethereum-classic, bitcoin-cash, bitcoin-gold, clore-ai) are served; any other
        id is a 404. Each id is asked once for every supported currency and
        cached 5 minutes, and any requested subset is answered from that.
        Coins CoinGecko stopped tracking (groestlcoin, bitcoin-gold) are priced from
        CoinPaprika's USD price (cached 10 minutes) times Bitcoin's current
        price ratio vs/usd. An upstream answer without a price is a 502 and is
        not cached. Upstream use is budgeted per provider; a spent budget or
        an upstream rate limit answers 429 with Retry-After.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated CoinGecko ids, at most 10; only the configured explorer coins (bitcoin, groestlcoin, litecoin, zcash, digibyte, dogecoin, dash, vertcoin, ravencoin, ethereum-classic, bitcoin-cash, bitcoin-gold, clore-ai) are served.
          schema:
            type: string
            example: bitcoin,groestlcoin
        - name: vs_currencies
          in: query
          required: true
          description: Comma-separated quote currencies from supported_vs_currencies, at most 60.
          schema:
            type: string
            example: usd,eur,btc
      responses:
        '200':
          description: Prices by id and quote currency. Ids or currencies without a price are left out.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: number
              example:
                bitcoin: { usd: 60000, eur: 50000 }
        '400':
          $ref: '#/components/responses/BlockbookBadRequest'
        '404':
          $ref: '#/components/responses/BlockbookCoinNotFound'
        '429':
          $ref: '#/components/responses/BlockbookRateLimited'
        '502':
          $ref: '#/components/responses/BlockbookUpstreamFailure'

  /v2/blockbook/api/v3/coins/{id}/market_chart:
    get:
      summary: Price chart (CoinGecko shape, prices only)
      description: >
        CoinGecko v3 `coins/{id}/market_chart` for Blockbook's fiat
        downloader; only `prices` is returned, null prices dropped. Only the
        configured explorer coins (bitcoin, groestlcoin, litecoin, zcash, digibyte, dogecoin, dash, vertcoin, ravencoin, ethereum-classic, bitcoin-cash, bitcoin-gold, clore-ai) are served; any other
        id is a 404. An upstream answer without prices is a 502 and is not
        cached.


        With `interval=daily`, the answer is sliced (points with
        ts >= now - days, or all for `max`) from one cached full daily series
        per coin and currency, fresh until the next 00:20 UTC; while the
        series lacks the newest closed day's 00:00 point it is asked again
        every 10 minutes. Without `interval`, `days` must be 1 or 90 (the
        windows Blockbook uses); it is passed through to CoinGecko and cached
        15 minutes for 1, 6 hours for 90.


        Coins CoinGecko stopped tracking (groestlcoin, bitcoin-gold): the daily
        series is CoinGecko's history up to the day before the configured
        cut-over (2026-07-20 for groestlcoin, 2026-07-27 for bitcoin-gold), then CoinPaprika's daily USD price (at most a year back)
        converted with Bitcoin's same-day price; days without a Bitcoin price
        are skipped. CoinGecko's history is only asked when the window starts
        before the cut-over; if it can't be had, the answer is a 502, never a
        partial history. Without `interval` they get CoinPaprika's hourly
        points for the last 23 hours (cached 30 minutes) at the current
        Bitcoin cross, whatever `days` asks for.
      parameters:
        - name: id
          in: path
          required: true
          description: CoinGecko coin id; only the configured explorer coins (bitcoin, groestlcoin, litecoin, zcash, digibyte, dogecoin, dash, vertcoin, ravencoin, ethereum-classic, bitcoin-cash, bitcoin-gold, clore-ai) are served.
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,100}$'
            example: bitcoin
        - name: vs_currency
          in: query
          required: true
          description: Quote currency from supported_vs_currencies.
          schema:
            type: string
            example: usd
        - name: days
          in: query
          required: true
          description: With interval=daily an integer 1..36500 or `max`; without, 1 or 90.
          schema:
            type: string
            example: '90'
        - name: interval
          in: query
          required: false
          description: Only `daily` is accepted.
          schema:
            type: string
            enum: [daily]
      responses:
        '200':
          description: Price points as [epochMs, price] pairs; daily points are at 00:00 UTC, plus CoinGecko's latest point.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: number
        '400':
          $ref: '#/components/responses/BlockbookBadRequest'
        '404':
          $ref: '#/components/responses/BlockbookCoinNotFound'
        '429':
          $ref: '#/components/responses/BlockbookRateLimited'
        '502':
          $ref: '#/components/responses/BlockbookUpstreamFailure'

  /v2/found-contracts:
    get:
      summary: Get found contracts
      description: Retrieves a list of found contracts.
      responses:
        '200':
          description: A list of found contracts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /v2/check-contracts:
    post:
      summary: Check and update contracts
      description: Checks contracts and updates the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Contracts checked and store updated.
          content:
            application/json:
              schema:
                type: object

  /metrics:
    get:
      summary: Get metrics data
      description: Provides metrics data using Prometheus middleware.
      responses:
        '200':
          description: Prometheus metrics data.

components:
  responses:
    BlockbookBadRequest:
      description: Missing, repeated or malformed parameter, too many ids or currencies, or an unsupported quote currency.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PriceHistoryError'
    BlockbookCoinNotFound:
      description: ZelCore does not list this id, or the upstream answered 404 (remembered for 10 minutes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PriceHistoryError'
          example:
            error: coin not found
    BlockbookRateLimited:
      description: >
        An upstream budget (CoinGecko 30/min burst 10 and 3000/day; CoinPaprika
        600/day burst 30) is spent, four calls to that provider are already in
        flight, or the provider rate-limited us and its cooldown is running.
      headers:
        Retry-After:
          description: Seconds until a retry can be admitted.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PriceHistoryError'
    BlockbookUpstreamFailure:
      description: Upstream failure (outage, timeout, unusable answer). Never cached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PriceHistoryError'
  schemas:
    PriceHistoryError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable reason.
