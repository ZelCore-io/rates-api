openapi: 3.0.0
info:
  title: Rates API
  description: API documentation for the Rates API.
  version: 3.0.0

paths:
  /:
    get:
      summary: Redirect to /rates
      description: Redirects the root path to the /rates endpoint.
      responses:
        '302':
          description: Redirection to /rates.

  /rates:
    get:
      summary: Get exchange rates
      description: Retrieves exchange rates.
      responses:
        '200':
          description: A list of exchange rates.
          content:
            application/json:
              schema:
                type: object

  /marketsusd:
    get:
      summary: Get market data in USD
      description: Retrieves market data in USD.
      responses:
        '200':
          description: A list of market data in USD.
          content:
            application/json:
              schema:
                type: object

  /v2/rates:
    get:
      summary: Get exchange rates (v2)
      description: >
        Retrieves version 2 of the exchange rates. The `crypto` array includes
        one synthetic entry per Binance bStock (tokenized US equity on BNB
        Smart Chain), alongside the regular CoinGecko/CryptoCompare/LiveCoinWatch
        entries.


        bStock entries are identified by `id` starting with `bstock-` (e.g.
        `bstock-tslab` for the Tesla bStock). They are always tagged
        `provider: "coingecko"` — never `"binance"` — because the ZelCore
        client matches market entries on the literal string
        `${provider}-${id}`, and the sibling `api` repo advertises each
        bStock's `coinInfo.coingeckoID` as `bstock-<code>`. Using any other
        provider value would make the client-side lookup miss silently.


        `rates.usd` and `rates.btc` are sourced from live Binance Spot
        `<CODE>USDT` tickers (bStocks are quoted in USDT, not USDC) divided by
        the same batch's `BTCUSDT` price; `change24h`/`change7d` come from
        Binance's 24h and 7d rolling-window tickers. During a CEX trading
        halt (e.g. around a stock split) the last known-good price is served
        rather than dropping the entry, per the bStocks partner guide's
        display-only allowance.
      responses:
        '200':
          description: A list of exchange rates (v2).
          content:
            application/json:
              schema:
                type: object
                properties:
                  crypto:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: bstock-tslab
                        provider:
                          type: string
                          example: coingecko
                        rates:
                          type: object
                          properties:
                            usd:
                              type: number
                            btc:
                              type: number
                        change24h:
                          type: number
                        change7d:
                          type: number
                  fiat:
                    type: array
                    items:
                      type: object
                  errors:
                    type: object

  /v2/rates-compressed:
    get:
      summary: Get compressed exchange rates (v2)
      description: Retrieves a compressed version of the exchange rates (v2).
      responses:
        '200':
          description: Compressed exchange rates (v2).
          content:
            application/json:
              schema:
                type: object

  /v2/prices/history/{geckoId}:
    get:
      summary: Get fiat price history for one coin
      description: >
        Price history for one CoinGecko id in one fiat currency between two
        unix timestamps, for wallet tax exports. Points in the last 90 UTC
        days are hourly; older points are daily (one per UTC day, 00:00). A
        range crossing that line returns granularity "mixed" with one daily
        and one hourly entry in `segments`. Only ids ZelCore carries are
        served. `from` before 2013-04-28 is clamped to it and `to` after now
        is clamped to now. Cached per coin, currency and UTC day (closed days
        30 days, today and empty days 1 hour); successful responses are also
        cached for 1 hour. Upstream use is budgeted; when the budget is spent
        or CoinGecko rate-limits, the endpoint answers 503 with Retry-After.
      parameters:
        - name: geckoId
          in: path
          required: true
          description: CoinGecko coin id.
          schema:
            type: string
            pattern: '^[a-z0-9-]{1,100}$'
            example: bitcoin
        - name: vs
          in: query
          required: true
          description: Fiat currency code (case-insensitive), e.g. usd, eur, gbp.
          schema:
            type: string
            example: eur
        - name: from
          in: query
          required: true
          description: Range start, unix seconds (inclusive).
          schema:
            type: integer
            example: 1514764800
        - name: to
          in: query
          required: true
          description: Range end, unix seconds (inclusive). Must be after `from`, at most 10 years later.
          schema:
            type: integer
            example: 1546300799
      responses:
        '200':
          description: Price points as [epochMs, price] pairs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: array
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items:
                        type: number
                  granularity:
                    type: string
                    enum: [daily, hourly, mixed]
                  segments:
                    type: array
                    description: Contiguous parts of the range by granularity; from/to are epoch ms, inclusive.
                    items:
                      type: object
                      properties:
                        granularity:
                          type: string
                          enum: [daily, hourly]
                        from:
                          type: integer
                        to:
                          type: integer
        '400':
          description: Invalid geckoId, unsupported vs currency, from >= to, from in the future, or a span over 10 years.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: ZelCore does not carry this id, or CoinGecko does not know it (cached for 10 minutes).
        '502':
          description: Upstream failure (outage, timeout).
        '503':
          description: Upstream budget spent, too many concurrent upstream calls, or CoinGecko rate limit cooldown.
          headers:
            Retry-After:
              description: Seconds until a retry can be admitted.
              schema:
                type: integer

  /v2/found-contracts:
    get:
      summary: Get found contracts
      description: Retrieves a list of found contracts.
      responses:
        '200':
          description: A list of found contracts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /v2/check-contracts:
    post:
      summary: Check and update contracts
      description: Checks contracts and updates the store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Contracts checked and store updated.
          content:
            application/json:
              schema:
                type: object

  /metrics:
    get:
      summary: Get metrics data
      description: Provides metrics data using Prometheus middleware.
      responses:
        '200':
          description: Prometheus metrics data.
